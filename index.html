function showCloudPopup(software, anchorEl){
  pendingSoftware = software;
  popup.classList.add("show");
  mask.classList.add("show");

  var rect = anchorEl.getBoundingClientRect();
  var popRect = popup.getBoundingClientRect();
  var popW = popRect.width;
  var popH = popRect.height;

  var centerX = rect.left + rect.width / 2;
  var left = centerX - popW / 2;
  var margin = 8;
  if(left + popW > window.innerWidth - margin){
    left = window.innerWidth - popW - margin;
  }
  if(left < margin){ left = margin; }

  var gap = 8;
  var tabbarH = 58;
  var spaceBelow = window.innerHeight - rect.bottom - tabbarH - gap;
  var spaceAbove = rect.top - gap;
  var top;
  var isAbove = false;

  if(spaceBelow >= popH){
    top = rect.bottom + gap;
  } else if(spaceAbove >= popH){
    top = rect.top - popH - gap;
    isAbove = true;
  } else {
    if(spaceBelow >= spaceAbove){
      top = rect.bottom + gap;
    } else {
      top = rect.top - popH - gap;
      isAbove = true;
    }
    if(top < gap){ top = gap; }
    if(top + popH > window.innerHeight - gap){ top = window.innerHeight - popH - gap; }
  }

  if(isAbove){
    popup.classList.add("above");
  } else {
    popup.classList.remove("above");
  }

  popup.style.left = left + "px";
  popup.style.top = top + "px";

  var arrowX = centerX - left;
  popup.style.setProperty("--arrow-x", arrowX + "px");
}

  if(!popup.classList.contains("show")) return;
  touchDragging = true;
  touchMoved = false;
  touchStartY = e.touches[0].clientY;
  popup.classList.add("dragging");
}

function onTouchMove(e){
  if(!touchDragging) return;
  var dy = e.touches[0].clientY - touchStartY;
  if(Math.abs(dy) > 8){ touchMoved = true; }
  var opacity = Math.max(0.3, 1 - Math.abs(dy) / 250);
  popup.style.transform = "translateY(" + dy + "px)";
  popup.style.opacity = opacity;
}

function onTouchEnd(e){
  if(!touchDragging) return;
  touchDragging = false;
  popup.classList.remove("dragging");
  var dy = (e.changedTouches[0].clientY) - touchStartY;
  if(Math.abs(dy) > 60){
    closePopup();
  } else {
    popup.style.transform = "";
    popup.style.opacity = "";
  }
}
